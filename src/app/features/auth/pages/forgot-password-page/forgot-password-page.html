<main class="auth-page">
  <section class="auth-card" aria-labelledby="forgot-password-title">
    <div class="auth-card__brand" aria-hidden="true">
      <span>O</span>
    </div>

    <header class="auth-card__header">
      <p>Orbiafly</p>
      <h1 id="forgot-password-title">Recuperar senha</h1>
      <span>Gere um código temporário e defina uma nova senha.</span>
    </header>

    <form
      class="auth-form"
      [formGroup]="form"
      (ngSubmit)="codeRequested() ? confirmReset() : requestCode()"
    >
      <label>
        <span>E-mail ou usuário</span>
        <i class="ph ph-user" aria-hidden="true"></i>
        <input type="text" formControlName="login" autocomplete="username" placeholder="admin" />
      </label>

      @if (codeRequested()) {
        <label>
          <span>Código</span>
          <i class="ph ph-number-circle-six" aria-hidden="true"></i>
          <input
            inputmode="numeric"
            formControlName="code"
            autocomplete="one-time-code"
            placeholder="000000"
          />
        </label>

        <label>
          <span>Nova senha</span>
          <i class="ph ph-lock-key" aria-hidden="true"></i>
          <input
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
            placeholder="Mínimo de 8 caracteres"
          />
        </label>
      }

      @if (error()) {
        <p class="auth-form__error">Não foi possível concluir a recuperação.</p>
      }

      <button class="button button--primary" type="submit" [disabled]="authStore.loading()">
        <i
          class="ph"
          [class.ph-paper-plane-tilt]="!codeRequested()"
          [class.ph-check]="codeRequested()"
          aria-hidden="true"
        ></i>
        {{
          authStore.loading()
            ? 'Processando...'
            : codeRequested()
              ? 'Redefinir senha'
              : 'Gerar código'
        }}
      </button>
    </form>

    <footer class="auth-card__footer">
      <span>Lembrou a senha?</span>
      <a routerLink="/login">Entrar</a>
    </footer>
  </section>
</main>
