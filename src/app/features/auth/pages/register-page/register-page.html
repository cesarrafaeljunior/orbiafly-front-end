<section class="auth-page">
  <div class="auth-panel">
    <a class="auth-brand" routerLink="/login"><span>O</span>Orbiafly</a>
    <header>
      <p class="eyebrow">Novo acesso</p>
      <h1>Criar conta</h1>
    </header>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label><span>Usuário</span><input formControlName="username" type="text" autocomplete="username" /></label>
      <label><span>E-mail</span><input formControlName="email" type="email" autocomplete="email" /></label>
      <label><span>Senha</span><input formControlName="password" type="password" autocomplete="new-password" /></label>
      <button class="button button--primary" type="submit" [disabled]="submitting()">Criar conta</button>
    </form>
    <p>Já tem conta? <a routerLink="/login">Entrar</a></p>
  </div>
</section>
