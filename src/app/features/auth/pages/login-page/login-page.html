<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <div class="auth-card__brand" aria-hidden="true">
      <span>O</span>
    </div>

    <header class="auth-card__header">
      <p>Orbiafly</p>
      <h1 id="login-title">Entrar</h1>
      <span>Acesse sua rotina financeira com sua conta.</span>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>E-mail ou usuário</span>
        <i class="ph ph-user" aria-hidden="true"></i>
        <input type="text" formControlName="login" autocomplete="username" placeholder="admin" />
      </label>

      <label>
        <span>Senha</span>
        <i class="ph ph-lock-key" aria-hidden="true"></i>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Sua senha"
        />
      </label>

      @if (error()) {
        <p class="auth-form__error">Credenciais inválidas.</p>
      }

      <a class="auth-form__link" routerLink="/recuperar-senha">Esqueci minha senha</a>

      <button class="button button--primary" type="submit" [disabled]="authStore.loading()">
        <i class="ph ph-sign-in" aria-hidden="true"></i>
        {{ authStore.loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <footer class="auth-card__footer">
      <span>Ainda não tem conta?</span>
      <a routerLink="/register">Criar conta</a>
    </footer>
  </section>
</main>
